<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personaliza a tua t-shirt — MadWod</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#555;--ink3:#888;--line:#e2e2e2;--bg:#fff;--card:#f6f6f6;--red:#d7263d;--blue:#2d6cdf;--blue-bg:#e8eefb;--font:"Barlow",-apple-system,"Segoe UI",Arial,sans-serif;--display:"Big Shoulders Display",Impact,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
h1{font-family:var(--display);font-weight:900;font-size:38px;line-height:1;margin:0 0 4px;letter-spacing:.01em}
.lead{color:var(--ink2);margin:0 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:radial-gradient(circle at 50% 40%,#f2f3f5,#d6d9de);border-radius:18px;padding:14px;position:sticky;top:10px}
@media(max-width:900px){.stage{position:static}}
.stage .v{position:relative}.stage .v span{position:absolute;top:2px;left:8px;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.tee-svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.box h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}.box h2 .g{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0;position:relative;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.part{padding:8px 0;border-bottom:1px solid var(--line)}.part:last-child{border:0}
.part b{font-size:14px}.part small{color:var(--ink3);float:right}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#aaa}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.sm{padding:6px 11px;font-size:14px}.btn.ghost{background:transparent;border-color:transparent}
.el{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px;cursor:pointer}
.el.on{border-color:var(--blue);background:var(--blue-bg)}
.fld{margin-top:10px}.fld label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:16px}
.fld input[type=range]{padding:0;accent-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sizes label{text-align:center}.sizes input{text-align:center;padding:8px 4px}
.muted{color:var(--ink3);font-size:13.5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.modal img{width:100%;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Personaliza a tua t-shirt</h1>
  <p class="lead">Escolhe as cores, junta o símbolo MadWod, o teu texto ou o logótipo da tua box, e pede-nos orçamento.</p>
  <div class="grid">
    <div><div class="stage" id="stage"></div><p class="muted" style="margin:8px 2px">Arrasta os elementos na t-shirt para os mudar de sítio.</p></div>
    <div id="panel"></div>
  </div>
</div>
<div id="ov"></div>

function teeElSvg(el,uid,forExport){

  return `<mask id="${mid}" maskUnits="userSpaceOnUse" x="${x}" y="${y}" width="${el.w}" height="${h}"><image href="${src}" x="${x}" y="${y}" width="${el.w}" height="${h}" preserveAspectRatio="none"/></mask><rect x="${x}" y="${y}" width="${el.w}" height="${h}" fill="${el.cor}" mask="url(#${mid})"/>`;
}
function teeBox(el){ if(el.tipo==="texto"){ const fs=Math.max(6,el.w/Math.max(3,(el.texto||"").length)*1.7); return {x:el.x-el.w/2-4,y:el.y-fs*0.62,w:el.w+8,h:fs*1.24}; } const h=el.w*(el.tipo==="imagem"?(el.r||1):ELR[el.tipo]); return {x:el.x-el.w/2-4,y:el.y-h/2-4,w:el.w+8,h:h+8}; }
function teeSvg(side,st,uid,forExport){
  const c=st.cores, back=side==="costas";
  const neckO=back?"C175,60 225,60 245,45":"C168,92 232,92 245,45", neckI=back?"C222,53 178,53 163,44":"C226,80 174,80 163,44";
  const torso=`M155,45 L112,62 L116,150 L118,392 Q200,400 282,392 L284,150 L288,62 L245,45 ${back?"C225,60 175,60 155,45":"C232,92 168,92 155,45"} Z`;
  const sleeveL="M112,62 L36,138 L74,176 L120,150 Z", cuffL="M36,138 L74,176 L81,169 L43,131 Z";
  const mir=s=>`<g transform="translate(400,0) scale(-1,1)">${s}</g>`;
  const stroke='stroke="rgba(0,0,0,.38)" stroke-width="1.4" stroke-linejoin="round"';
  const els=st.els.filter(e=>e.side===side);
  const sel=!forExport&&st.els.find(e=>e.id===st.sel&&e.side===side);
  const bb=sel?teeBox(sel):null;
  return `<svg viewBox="0 0 400 410" xmlns="http://www.w3.org/2000/svg" ${forExport?"":`class="tee-svg" data-side="${side}"`}>
    <defs><linearGradient id="sh-${uid}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
      <linearGradient id="sv-${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
      <clipPath id="cl-${uid}"><path d="${torso}"/><path d="${sleeveL}"/><path d="${sleeveL}" transform="translate(400,0) scale(-1,1)"/></clipPath></defs>
    <path d="${sleeveL}" fill="${c.mangas}" ${stroke}/>${mir(`<path d="${sleeveL}" fill="${c.mangas}" ${stroke}/>`)}
    <path d="${cuffL}" fill="${c.punhos}" ${stroke}/>${mir(`<path d="${cuffL}" fill="${c.punhos}" ${stroke}/>`)}
    <path d="${torso}" fill="${c.corpo}" ${stroke}/>
    ${back?"":`<path d="M163,44 ${neckI.replace("C226,80 174,80 163,44","C174,80 226,80 237,44")} C222,52 178,52 163,44 Z" fill="${c.corpo}"/><path d="M163,44 C174,80 226,80 237,44 C222,52 178,52 163,44 Z" fill="#000" opacity=".28"/>`}
    <path d="M118,380 Q200,388 282,380 L282,392 Q200,400 118,392 Z" fill="${c.punhos}" ${stroke}/>
    <path d="M155,45 ${neckO} L237,44 ${neckI} Z" fill="${c.gola}" ${stroke}/>
    <g clip-path="url(#cl-${uid})">${els.map(e=>`<g ${forExport?"":`class="tee-el" data-el="${e.id}" style="cursor:move"`}>${teeElSvg(e,uid,forExport)}</g>`).join("")}</g>
    <g pointer-events="none"><path d="${torso}" fill="url(#sh-${uid})"/><path d="${torso}" fill="url(#sv-${uid})"/>
      <path d="M150,290 Q168,320 160,368 M250,282 Q234,320 244,370 M60,150 L100,125" stroke="#000" stroke-opacity=".07" stroke-width="2" fill="none"/>
      <path d="M116,150 L118,392 M284,150 L282,392" stroke="#000" stroke-opacity=".12" stroke-width="1" fill="none"/></g>
    ${bb?`<rect x="${bb.x}" y="${bb.y}" width="${bb.w}" height="${bb.h}" fill="none" stroke="#3d7bea" stroke-width="1.5" stroke-dasharray="5 4" pointer-events="none"/>`:""}
  </svg>`;
}

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function stage(){ const st=teeState(); $("#stage").innerHTML=`<div class="v"><span>Frente</span>${teeSvg("frente",st,"f")}</div><div class="v"><span>Costas</span>${teeSvg("costas",st,"c")}</div>`; bindDrag(); }
function sw(part,cur){ return `<div class="row" style="gap:6px">${TEE_CORES.map(([n,h])=>`<button class="sw ${String(cur).toLowerCase()===h?"on":""}" data-cor="${part}" data-hex="${h}" title="${esc(n)}" aria-label="${esc(n)}" style="background:${h}"></button>`).join("")}<label class="sw" title="Outra cor" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"><input type="color" data-pick="${part}" value="${esc(cur)}"></label></div>`; }
function panel(){
  const st=teeState(); const sel=st.els.find(e=>e.id===st.sel);
  $("#panel").innerHTML=`<div class="box"><h2><span class="g">1. Cores</span><button class="btn sm ghost" data-a="same">Mesma cor em tudo</button></h2>
    ${TEE_PARTES.map(([k,l])=>`<div class="part"><b>${l}</b><small>${esc(corNome(st.cores[k]))}</small><div style="margin-top:6px">${sw(k,st.cores[k])}</div></div>`).join("")}</div>
  <div class="box"><h2>2. Elementos</h2>
    <div class="row" style="margin-bottom:10px"><button class="btn sm" data-add="simbolo">+ Símbolo M</button><button class="btn sm" data-add="wordmark">+ MADWOD</button><button class="btn sm" data-add="texto">+ Texto</button><button class="btn sm" data-a="img">+ O meu logótipo</button></div>
    ${st.els.map((e,i)=>`<div class="el ${e.id===st.sel?"on":""}" data-sel="${e.id}"><b>${i+1}.</b><span style="flex:1;font-size:14px">${esc(teeElNome(e))} · ${e.side}</span><button class="btn sm ghost" data-rm="${e.id}" aria-label="Remover">✕</button></div>`).join("")||`<p class="muted">Ainda sem elementos.</p>`}
    ${sel?`${sel.tipo==="texto"?`<div class="fld"><label>Texto</label><input id="fTxt" value="${esc(sel.texto||"")}" maxlength="24"></div>`:""}
      <div class="two"><div class="fld"><label>Lado</label><select id="fSide"><option value="frente" ${sel.side==="frente"?"selected":""}>Frente</option><option value="costas" ${sel.side==="costas"?"selected":""}>Costas</option></select></div>
      <div class="fld"><label>Posição</label><select id="fPos"><option value="">— escolher —</option>${TEE_POS[sel.side].map((p,i)=>`<option value="${i}">${p[0]}</option>`).join("")}</select></div></div>
      <div class="fld"><label>Tamanho</label><input type="range" id="fW" min="16" max="240" value="${sel.w}"></div>
      ${sel.tipo==="imagem"?"":`<div class="fld"><label>Cor do elemento</label>${sw("el",sel.cor)}</div>`}`:""}</div>
  <div class="box"><h2>3. Guardar e pedir orçamento</h2>
    <div class="row"><button class="btn" data-a="png">⬇ Descarregar imagem</button><button class="btn red" data-a="orc">Pedir orçamento</button></div>
    <p class="muted" style="margin:8px 0 0">O desenho fica guardado neste aparelho. <span role="button" tabindex="0" style="text-decoration:underline;cursor:pointer" data-a="reset">Recomeçar</span></p></div>`;
  const s=sel;
  document.querySelectorAll("[data-pick]").forEach(i=>i.addEventListener("input",()=>{ const k=i.dataset.pick; if(k==="el"){ if(s) s.cor=i.value; } else st.cores[k]=i.value; teeSave(); stage(); }));
  document.querySelectorAll("[data-pick]").forEach(i=>i.addEventListener("change",()=>panel()));
  if(s){ const t=$("#fTxt"); if(t) t.addEventListener("input",()=>{ s.texto=t.value; teeSave(); stage(); });
    $("#fSide").addEventListener("change",e=>{ s.side=e.target.value; const p=TEE_POS[s.side][1]; s.x=p[1]; s.y=p[2]; teeSave(); all(); });
    $("#fPos").addEventListener("change",e=>{ const p=TEE_POS[s.side][+e.target.value]; if(!p) return; s.x=p[1]; s.y=p[2]; s.w=s.tipo==="wordmark"?Math.max(p[3],60):p[3]; teeSave(); all(); });
    $("#fW").addEventListener("input",e=>{ s.w=+e.target.value; teeSave(); stage(); }); }
}
function all(){ stage(); panel(); }
function bindDrag(){ const st=teeState();
  document.querySelectorAll(".tee-svg").forEach(svg=>svg.addEventListener("pointerdown",ev=>{ const g=ev.target.closest(".tee-el"); if(!g) return; ev.preventDefault();
    const el=st.els.find(e=>e.id===g.dataset.el); if(!el) return; const ch=st.sel!==el.id; st.sel=el.id;
    const ctm=svg.getScreenCTM().inverse(), pt=svg.createSVGPoint(); const to=(x,y)=>{ pt.x=x; pt.y=y; return pt.matrixTransform(ctm); };
    const p0=to(ev.clientX,ev.clientY), ox=el.x, oy=el.y; let raf=null;
    const mv=e=>{ const p=to(e.clientX,e.clientY); el.x=Math.round(Math.min(395,Math.max(5,ox+p.x-p0.x))); el.y=Math.round(Math.min(405,Math.max(5,oy+p.y-p0.y))); if(!raf) raf=requestAnimationFrame(()=>{ raf=null; stage(); }); };
    const up=()=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); teeSave(); if(ch) panel(); stage(); };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); }));
}
function pickFile(){ return new Promise(r=>{ const i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.onchange=()=>r(i.files[0]||null); i.click(); }); }
function resizeImage(file,mw,mh){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const r=Math.min(1,mw/im.width,mh/im.height); const c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res({src:c.toDataURL("image/png"),r:c.height/c.width}); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
async function makePng(){
  const st=teeState(); const W=1600,H=1100;
  const shirt=(side,x)=>teeSvg(side,st,"x"+side,true).replace(/^\s*<svg[^>]*>/,`<svg x="${x}" y="185" width="700" height="718" viewBox="0 0 400 410">`);
  const elsTxt=st.els.map((e,i)=>`${i+1}. ${teeElNome(e)} — ${e.side}${e.tipo==="imagem"?"":", "+corNome(e.cor)}`);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#d4d7dd"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bg)"/><rect width="${W}" height="110" fill="#111"/><image href="${LOGO_W}" x="60" y="34" width="${42*640/124}" height="42"/>
    <text x="${W-60}" y="62" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">A minha t-shirt MadWod</text><text x="${W-60}" y="92" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#bbb">${fmtDate(today())}</text>
    <text x="410" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#444">FRENTE</text><text x="1190" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#444">COSTAS</text>
    ${shirt("frente",60)}${shirt("costas",840)}<rect x="0" y="${H-150}" width="${W}" height="150" fill="#fff" opacity=".85"/>
    ${TEE_PARTES.map(([k,l],i)=>`<g transform="translate(${60+i*230},${H-118})"><circle cx="14" cy="14" r="14" fill="${st.cores[k]}" stroke="#999"/><text x="38" y="11" font-family="Arial, sans-serif" font-size="15" fill="#777">${l}</text><text x="38" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#222">${esc(corNome(st.cores[k]))}</text></g>`).join("")}
    ${elsTxt.slice(0,6).map((t,i)=>`<text x="${980+(i>=3?310:0)}" y="${H-104+(i%3)*30}" font-family="Arial, sans-serif" font-size="16" fill="#333">${esc(t)}</text>`).join("")}
    <text x="60" y="${H-28}" font-family="Arial, sans-serif" font-size="14" fill="#888">Imagem ilustrativa — cores e dimensões finais podem variar. madwodsports.com · ${LOJA_EMAIL}</text></svg>`;
  const img=new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); });
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.getContext("2d").drawImage(img,0,0);
  return await new Promise(r=>cv.toBlob(r,"image/png"));
}
function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); return url; }
async function showPng(){ try{ const b=await makePng(); const url=downloadBlob(b,"tshirt-madwod.png");
  $("#ov").innerHTML=`<div class="ov" data-close="1"><div class="modal"><h2 style="margin:0 0 10px">A tua imagem</h2><img src="${url}" alt="Pré-visualização da t-shirt"><p class="muted">Se a imagem não descarregou (por exemplo no iPhone), mantém o dedo em cima dela e escolhe “Guardar imagem”.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close="1">Fechar</button></div></div></div>`; }catch(e){ toast("Não foi possível criar a imagem"); } }
function resumo(f){ const st=teeState(); const tams=Object.entries(f.tams).filter(([,v])=>+v>0).map(([k,v])=>`${k}: ${v}`).join(", ");
  return `Olá MadWod,\n\nGostaria de pedir orçamento para esta t-shirt personalizada:\n\nCores\n${TEE_PARTES.map(([k,l])=>`- ${l}: ${corNome(st.cores[k])}`).join("\n")}\n\nElementos\n${st.els.map((e,i)=>`- ${teeElNome(e)} (${e.side})${e.tipo==="imagem"?"":", cor "+corNome(e.cor)}`).join("\n")||"- (nenhum)"}\n\nQuantidade: ${f.qtd||"—"}${tams?`\nTamanhos: ${tams}`:""}\n${f.notas?`\nNotas: ${f.notas}\n`:""}\nNome: ${f.nome}\nContacto: ${f.contacto}\n\n(Envio em anexo a imagem do modelo.)`; }
function orcForm(){
  $("#ov").innerHTML=`<div class="ov"><div class="modal"><h2 style="margin:0 0 4px">Pedir orçamento</h2><p class="muted" style="margin:0">Preenche os dados. Vamos abrir o teu email com o pedido pronto; junta a imagem que descarregámos.</p>
    <div class="two"><div class="fld"><label>Nome</label><input id="oNome" autocomplete="name"></div><div class="fld"><label>Email ou telefone</label><input id="oCont" autocomplete="email"></div></div>
    <div class="fld"><label>Quantidade total</label><input id="oQtd" inputmode="numeric" placeholder="ex.: 30"></div>
    <div class="fld"><label>Tamanhos (opcional)</label><div class="sizes">${["XS","S","M","L","XL","XXL"].map(t=>`<label><span class="muted">${t}</span><input data-t="${t}" inputmode="numeric"></label>`).join("")}</div></div>
    <div class="fld"><label>Notas</label><textarea id="oNotas" rows="3" placeholder="ex.: data em que precisas, tipo de tecido…"></textarea></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close="1">Cancelar</button>${WHATSAPP?`<button class="btn" data-a="wa">WhatsApp</button>`:""}<button class="btn red" data-a="mail">Preparar email</button></div>
    <p class="muted" style="margin:10px 0 0">Se o email não abrir, escreve para <b>${LOJA_EMAIL}</b> com a imagem em anexo.</p></div></div>`;
}
function readOrc(){ const tams={}; document.querySelectorAll("[data-t]").forEach(i=>tams[i.dataset.t]=i.value.trim()); return {nome:$("#oNome").value.trim(),contacto:$("#oCont").value.trim(),qtd:$("#oQtd").value.trim(),notas:$("#oNotas").value.trim(),tams}; }
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-cor],[data-add],[data-sel],[data-rm],[data-a],[data-close]"); if(!t) return; const d=t.dataset; const st=teeState();
  if(d.close&&(e.target===t||t.tagName==="BUTTON")){ $("#ov").innerHTML=""; return; }
  if(d.cor){ if(d.cor==="el"){ const s=st.els.find(x=>x.id===st.sel); if(s) s.cor=d.hex; } else st.cores[d.cor]=d.hex; teeSave(); all(); return; }
  if(d.add){ const side=st.els.filter(x=>x.side==="frente").length>st.els.filter(x=>x.side==="costas").length?"costas":"frente"; const p=d.add==="simbolo"?TEE_POS[side][0]:TEE_POS[side][1]; const id="e"+Date.now().toString(36);
    st.els.push({id,side,tipo:d.add,texto:d.add==="texto"?"A MINHA BOX":"",cor:String(st.cores.corpo).toLowerCase()==="#f4f4f2"?"#141414":"#f4f4f2",x:p[1],y:p[2],w:d.add==="wordmark"?Math.max(p[3],90):d.add==="texto"?Math.max(p[3],100):p[3]}); st.sel=id; teeSave(); all(); return; }
  if(d.rm){ e.stopPropagation(); st.els=st.els.filter(x=>x.id!==d.rm); if(st.sel===d.rm) st.sel=(st.els[0]||{}).id; teeSave(); all(); return; }
  if(d.sel){ st.sel=d.sel; teeSave(); all(); return; }
  const a=d.a;
  if(a==="same"){ TEE_PARTES.forEach(([k])=>st.cores[k]=st.cores.corpo); teeSave(); all(); }
  else if(a==="img"){ const f=await pickFile(); if(!f) return; try{ const r=await resizeImage(f,600,600); const id="e"+Date.now().toString(36); st.els.push({id,side:"frente",tipo:"imagem",src:r.src,r:r.r,cor:"#000",x:200,y:160,w:90}); st.sel=id; teeSave(); all(); }catch(err){ toast("Não foi possível ler a imagem"); } }
  else if(a==="png") showPng();
  else if(a==="orc") orcForm();
  else if(a==="mail"||a==="wa"){ const f=readOrc(); if(!f.nome||!f.contacto){ toast("Preenche o nome e o contacto"); return; }
    try{ downloadBlob(await makePng(),"tshirt-madwod.png"); }catch(err){}
    const body=resumo(f);
    if(a==="wa") window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(body)}`,"_blank");
    else { const href=`mailto:${LOJA_EMAIL}?subject=${encodeURIComponent("Pedido de orçamento — t-shirt personalizada")}&body=${encodeURIComponent(body)}`; const l=document.createElement("a"); l.href=href; l.target="_top"; document.body.appendChild(l); l.click(); l.remove(); }
    $("#ov").innerHTML=`<div class="ov" data-close="1"><div class="modal"><h2 style="margin:0 0 8px">Quase pronto</h2><p>Abrimos o teu ${a==="wa"?"WhatsApp":"email"} com o pedido. A imagem do modelo foi descarregada: junta-a à mensagem e envia.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-close="1">OK</button></div></div></div>`; }
  else if(a==="reset"){ if(confirm("Recomeçar o desenho?")){ UI.tee=null; try{ localStorage.removeItem("madwod-tee-pub"); }catch(err){} all(); } }
});
all();
</script>
</body>
</html>
